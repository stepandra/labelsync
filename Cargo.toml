[package]
name = "labelsync"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
automerge = "0.12"
blake3 = "1.8.7"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
csv = "1.4.0"
dissimilar = "1.0.11"
futures-lite = "2.6.1"
hex = "0.4.3"
humantime = "2.4.0"
iroh = "1.3"
iroh-blobs = "0.103"
iroh-docs = "0.101"
iroh-gossip = "0.101"
iroh-tickets = "1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zstd = "0.14.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
